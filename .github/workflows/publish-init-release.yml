# 手动打包 Debian_*_Init 并发布 GitHub Release。
# 一键 curl（releases/latest/download/...）依赖本 workflow 打出的附件。
name: Publish Init Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag，如 v0.1.6。留空则用 UTC 日期 vYYYY.MM.DD'
        required: false
        type: string
        default: ''
      mark_latest:
        description: '标为 latest（README 一键拉取用 /releases/latest/download/）'
        required: true
        type: boolean
        default: true
      notes:
        description: '额外 Release 说明（可选）'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="$(echo "${INPUT_TAG:-}" | tr -d '[:space:]')"
          if [ -z "$TAG" ]; then
            TAG="v$(date -u +%Y.%m.%d)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "将发布 tag: $TAG  (commit ${GITHUB_SHA})"

      - name: Build tarballs
        run: bash release/build.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          MARK_LATEST: ${{ inputs.mark_latest }}
          EXTRA_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          args=("$TAG")
          if [ "$MARK_LATEST" = "true" ]; then
            args+=(--latest)
          else
            args+=(--no-latest)
          fi
          if [ -n "${EXTRA_NOTES:-}" ]; then
            args+=(--notes "$EXTRA_NOTES")
          fi
          bash release/publish.sh "${args[@]}"
