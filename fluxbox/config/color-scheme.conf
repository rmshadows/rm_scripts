# 亮/暗色方案（仅 GTK 应用，不改变 Fluxbox 当前主题）
# 编辑 ~/.fluxbox/config/color-scheme.conf

GTK_COLOR_SCHEME_LIGHT='default'
GTK_COLOR_SCHEME_DARK='prefer-dark'
GTK_THEME_LIGHT='Adwaita'
GTK_THEME_DARK='Adwaita-dark'
GTK_ICON_LIGHT='Adwaita'
GTK_ICON_DARK='Adwaita'
GTK2_THEME_LIGHT='niroki'
GTK2_THEME_DARK='Adwaita-dark'

