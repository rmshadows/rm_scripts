# 安装后：/etc/nginx/sites-available/html.conf
# GNOME 本机共享站：root=/home/HTML，listen 80 default_server。
# 新机器不用 Debian 默认 /var/www/html。
# 部署时替换：__PHP_SOCK__（如 unix:/run/php/php8.4-fpm.sock）
# fmgr：SET_CONFIG_FMGR=1 时 setup 会取消下面 include 注释，并注释掉 BEGIN_DENY_DYNAMIC。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /home/HTML;
    index index.html index.php index.htm;

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass __PHP_SOCK__;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    ##################################################################
    # 拦截非 PHP 的动态脚本；装 fmgr 时 setup 会整段注释掉
    # BEGIN_DENY_DYNAMIC
    location ~ \.(py|pl|cgi|sh)$ {
        return 403;
    }
    # END_DENY_DYNAMIC

    if ($request_method !~ ^(GET|HEAD|POST)$) {
        return 444;
    }

    ##################################################################
    # FMGR：SET_CONFIG_FMGR=1 时取消注释
    # include /etc/nginx/snippets/fmgr.conf;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\.ht {
        deny all;
    }
}
