# fmgr 专用 location 片段，不包含 server 块、不含 PHP。
# 由 setupNginxForFmgr.sh 写入 /etc/nginx/snippets/fmgr.conf。
# 要求：
#   1) 所在 server 的 root 已是 fmgr 父目录（如 /home/HTML）
#   2) 所在 server 已有 location ~ \.php$（通用 PHP 放 site，不放本 snippet）
# 在 server { } 内加一行：include /etc/nginx/snippets/fmgr.conf;

location /fmgr/ {
    # debug：需要列目录时再取消下面三行注释（生产建议保持关闭）
    # autoindex on;
    # autoindex_exact_size off;
    # autoindex_localtime off;
}

location /x {
    rewrite ^/x(/|/index\.html)?$ /fmgr/index.php last;
}

location ~ ^/fmgr/filesfmgr {
    rewrite ^/fmgr/filesfmgr(.*)$ /fmgr/$1 last;
}
