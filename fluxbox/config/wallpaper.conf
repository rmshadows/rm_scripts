# 壁纸切换配置（scripts/wallpaper/wallpaper.sh）
#
# 默认壁纸目录: <fluxbox根目录>/backgrounds/
# （脚本根据自身位置自动解析，部署后即 ~/.fluxbox/backgrounds）
# 部署时不会覆盖 backgrounds/，请自行放入图片

# 仅当目录不在默认位置时取消注释:
# WALLPAPER_DIR="${HOME}/.fluxbox/backgrounds"

# 无记录时使用的默认壁纸（留空则取目录内排序第一张）
# WALLPAPER_DEFAULT="${HOME}/.fluxbox/backgrounds/your-wallpaper.jpg"

# fbsetbg 参数：-a 表示全屏铺满所有显示器
FBSETBG_OPTS="-a"
