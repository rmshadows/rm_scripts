# /etc/nginx/snippets/security-scan.conf
# include /etc/nginx/snippets/security-scan.conf;
# ⚠ 必须放在 server{} 内、站点自己的 location 之前：
#   正则 location 按出现顺序取第一个命中，放后面会被站点正则截胡
# ============================================================
# Nginx Security Scan Protection
# 拦截常见 Web 漏洞扫描、敏感文件探测
# ============================================================

# ------------------------------------------------------------
# 1. 环境变量 / 敏感配置文件
# ------------------------------------------------------------
location ~* ^/\.env(?:\..*)?$ {
    return 404;
}

location ~* ^/\.ht(?:access|passwd)$ {
    return 404;
}

# ------------------------------------------------------------
# 2. Git 仓库内部文件
# 网站可以正常使用 Git，但禁止 HTTP 访问 .git
# ------------------------------------------------------------
location ^~ /.git/ {
    return 404;
}

location = /.git {
    return 404;
}

# .gitignore / .gitattributes 等单文件（^~ /.git/ 只覆盖目录）
location ~* ^/\.git(?:ignore|attributes)$ {
    return 404;
}

# ------------------------------------------------------------
# 3. 常见 WordPress 扫描
# ------------------------------------------------------------
location = /wp-login.php {
    return 404;
}

location ^~ /wp-admin/ {
    return 404;
}

location ^~ /wordpress/ {
    return 404;
}

location = /xmlrpc.php {
    return 404;
}

# ------------------------------------------------------------
# 4. phpMyAdmin 扫描
# ------------------------------------------------------------
location ^~ /phpmyadmin/ {
    return 404;
}

location = /phpmyadmin {
    return 404;
}

# ------------------------------------------------------------
# 5. 常见敏感 / 备份文件
# ------------------------------------------------------------
location ~* \.(?:bak|backup|old|orig|save|swp|swo|tmp|sql)$ {
    return 404;
}

# ------------------------------------------------------------
# 6. 常见服务器 / 项目配置文件
# ------------------------------------------------------------
location ~* ^/(?:composer\.(?:json|lock)|package-lock\.json|yarn\.lock|Dockerfile|docker-compose.*|\.DS_Store)$ {
    return 404;
}

# ------------------------------------------------------------
# 7. 常见 Git / SVN / IDE 目录
# ------------------------------------------------------------
location ^~ /.svn/ {
    return 404;
}

location ^~ /.hg/ {
    return 404;
}

location ^~ /.idea/ {
    return 404;
}

location ^~ /.vscode/ {
    return 404;
}

# ------------------------------------------------------------
# 8. 凭证目录探测
# ------------------------------------------------------------
location ^~ /.ssh/ {
    return 404;
}

location ^~ /.aws/ {
    return 404;
}
