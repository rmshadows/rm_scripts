# managed-by-idle-blank-fix
# KVM 切走后这台机器没有键鼠。超过 10 分钟 X 会自己把画面涂黑，
# 切回来时显示器对不上，画面就一直黑。这里把涂黑和 DPMS 都关掉。
# 登录界面也生效，改完要重新进入图形界面。

Section "ServerFlags"
    Option "BlankTime"   "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime"     "0"
EndSection

Section "Extensions"
    Option "DPMS" "false"
EndSection
