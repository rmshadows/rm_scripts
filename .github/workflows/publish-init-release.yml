# 手动打包 Debian_*_Init 并发布 GitHub Release。
# 一键 curl 使用固定 tag debian-init，不走 /releases/latest/（后者可能是 PDF 手动发版）。
name: Publish Init Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '版本快照 tag，如 v0.1.6。留空则用 UTC 日期 vYYYY.MM.DD。同时会更新滚动通道 debian-init'
        required: false
        type: string
        default: ''
      notes:
        description: '额外 Release 说明（可选）'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="$(echo "${INPUT_TAG:-}" | tr -d '[:space:]')"
          if [ -z "$TAG" ]; then
            TAG="v$(date -u +%Y.%m.%d)"
          fi
          if [ "$TAG" = "debian-init" ]; then
            echo "不要把版本 tag 设成 debian-init（那是滚动通道）。请留空或填 v0.1.6 这类。" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "将发布版本 tag: $TAG ，并更新 debian-init  (commit ${GITHUB_SHA})"

      - name: Build tarballs
        run: bash release/build.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          EXTRA_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          args=("$TAG" --no-latest --rolling)
          if [ -n "${EXTRA_NOTES:-}" ]; then
            args+=(--notes "$EXTRA_NOTES")
          fi
          bash release/publish.sh "${args[@]}"
