# fmgr 专用 location 片段，不包含 server 块。
# 由 setupNginxForFmgr.sh 复制到 /etc/nginx/snippets/fmgr.conf 并填入 root 路径与 PHP socket。
# 用户只需在自己的 site-enabled 里某个 server { } 内加一行：include /etc/nginx/snippets/fmgr.conf;
# include 本片段后即自带 PHP 处理，无需再单独配 location ~ \.php$
#
# 注：若目标 site 已有自己的 PHP location，setup 脚本会自动用 sed 删掉下面
#     # BEGIN_FMGR_PHP ~ # END_FMGR_PHP 之间的块，避免 nginx -t 报 'duplicate location'

# BEGIN_FMGR_PHP
# PHP 处理：fmgr 是 PHP 应用，必须有此 location 才能跑
# fastcgi_pass 由脚本根据实际检测的 PHP-FPM socket 自动填入（不写死版本）
location ~ \.php$ {
    fastcgi_pass    __PHP_SOCK__;
    fastcgi_index   index.php;
    include         fastcgi.conf;
}
# END_FMGR_PHP

# root 由脚本根据 fmgr 目录自动填入
location /fmgr/ {
    rewrite ^/fmgr/(.*)$ /fmgr/$1 break;
    root __FMGR_PARENT__;
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime off;
}

location /x {
    rewrite ^/x(/|/index\.html)?$ /fmgr/index.php;
}

location ~ ^/fmgr/filesfmgr {
    rewrite ^/fmgr/filesfmgr(.*)$ /fmgr/$1;
}
